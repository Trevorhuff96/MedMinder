name: CI and Folder Notifications

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - '*.py'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'

  # Job 1: Run your Python Tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: pytest

  # Job 2: Create the notification Issue
  notify:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.docs == 'true'
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Notification Issue via GitHub CLI
        run: |
          gh issue create \
            --title "New file activity in tracked directory" \
            --body "New activity detected in your tracked directory (Design Decisions or Requirements) by @${{ github.actor }}.
            
            **Commit Details:** ${{ github.sha }}
            **Compare Changes:** ${{ github.event.compare }}"
