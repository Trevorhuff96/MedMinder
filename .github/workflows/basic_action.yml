name: CI and Folder Notifications

on:
  push:
    branches: ["main"]
    # Triggers if Python files change OR if files in these specific folders change
    paths:
      - 'Design Decisions/**'
      - 'Requirements/**'
      - '**.py'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Job 1: Run your Python Tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: pytest

  # Job 2: Create the notification Issue
  notify:
    runs-on: ubuntu-latest
    # Optional: uncomment 'needs: test' if you only want an issue if tests pass
    # needs: test 
    if: github.event_name == 'push'
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create Notification Issue via GitHub CLI
        run: |
          gh issue create \
            --title "New file activity in tracked directory" \
            --label "notification" \
            --body "New activity detected in your tracked directory (Design Decisions or Requirements) by @${{ github.actor }}.
            
            **Commit Details:** ${{ github.sha }}
            **Compare Changes:** ${{ github.event.compare }}"